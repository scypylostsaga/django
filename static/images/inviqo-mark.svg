<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Subtle warm luxury glow) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9" />
      <stop offset="100%" stop-color="#FEF3C7" stop-opacity="0.6" />
    </linearGradient>

    <!-- Rich Amber-Gold Gradient for Main Emblem -->
    <linearGradient id="goldStem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#854D0E" />
    </linearGradient>

    <!-- Warm Golden Gradient for Envelope Lines -->
    <linearGradient id="goldEnvelope" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B45309" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>

    <!-- Sparkle Glow -->
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="35%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#78350F" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Squircle rounded container -->
  <rect x="5" y="5" width="110" height="110" rx="28" fill="url(#bgGrad)" stroke="#FDE68A" stroke-width="1.5" />

  <!-- Logo Mark Graphic: Envelope + Stylized 'I' + Sparkles -->
  <g id="mark" filter="url(#softGlow)">
    <!-- Envelope contour -->
    <path d="M25 45 L55 64 C58 66 62 66 65 64 L74 58" 
          stroke="url(#goldEnvelope)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    
    <path d="M25 45 C25 41 28 38 32 37 L58 28 C61 27 65 28 67 31 L75 42" 
          stroke="url(#goldEnvelope)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <path d="M25 46 L29 76 C29.5 79.5 32.5 82 36 82 L70 82" 
          stroke="url(#goldEnvelope)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- Stylized Elegant Letter 'I' Column with Flaring Base & Serif -->
    <path d="M64 86 C67 86 69 85 70 82 L70 48 C70 42 73 37 78 35 C75 35 72 36 69 38 C65.5 40 64 44 64 48 L64 78 C64 83 62 85 59 86 Z" 
          fill="url(#goldStem)" />
    <path d="M68 86 H88 C87 83 85 82 82 82 L82 48 C82 41 84 37 87 35 C83 35 78 36 75 38 L75 82 C72 82 70 83 68 86 Z"
          fill="url(#goldStem)" />

    <!-- Celebration Magic Sparkles -->
    <!-- Primary Star -->
    <path d="M84 18 C84 22 87 25 91 25 C87 25 84 28 84 32 C84 28 81 25 77 25 C81 25 84 22 84 18 Z" 
          fill="url(#sparkleGrad)" />
    <!-- Secondary Mini Star -->
    <path d="M96 12 C96 14 97.5 15.5 99.5 15.5 C97.5 15.5 96 17 96 19 C96 17 94.5 15.5 92.5 15.5 C94.5 15.5 96 14 96 12 Z" 
          fill="#F59E0B" />
    <circle cx="75" cy="14" r="1.5" fill="#FBBF24" />
  </g>
</svg>
